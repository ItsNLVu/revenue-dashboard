# Optional: PostgreSQL in Docker instead of a native install (see README, step 3 option B).
services:
  db:
    image: postgres:16-alpine
    container_name: revenue-dashboard-db
    environment:
      POSTGRES_USER: revenue
      POSTGRES_PASSWORD: revenue
      POSTGRES_DB: revenue_dashboard
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revenue -d revenue_dashboard"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
